version: '3.8'

services:
  backend:
    build: ./backend
    container_name: web-dashboard-backend
    ports:
      - "${BACKEND_PORT}:${BACKEND_PORT}"
    environment:
      - FLASK_APP=app.py
      - FLASK_DEBUG=0
      - BACKEND_PORT=${BACKEND_PORT}
    env_file:
      - .env
    volumes:
      # Mount the local SQLite database file to persist data
      # Ensure this file exists on host or file permissions allow creation
      - ./backend/local_data.db:/app/local_data.db
    restart: always

  frontend:
    build:
      context: ./frontend
      args:
        # Defaults to localhost:5000 for local docker-compose
        # Change this if deploying to a remote server (e.g. http://your-domain.com:5000)
        - REACT_APP_API_BASE_URL=
        - REACT_APP_GOOGLE_CLIENT_ID=${REACT_APP_GOOGLE_CLIENT_ID:-MISSING_ID}
    container_name: web-dashboard-frontend
    ports:
      - "${FRONTEND_PORT}:${FRONTEND_PORT}"
    environment:
      - FRONTEND_PORT=${FRONTEND_PORT}
      - BACKEND_PORT=${BACKEND_PORT}
    depends_on:
      - backend
    restart: always
