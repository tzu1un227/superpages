version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "9017:5000"
    environment:
      - PYTHONUNBUFFERED=1
    restart: always

  frontend:
    build: ./frontend
    ports:
      - "9016:9016"
    depends_on:
      - backend
    environment:
      - VITE_API_URL=http://localhost:9017
    restart: always
